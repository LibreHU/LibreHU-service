name: Diagnostics test (Android 9)

# The service's diagnostics (diag/DiagnosticsProvider) on an Android 9 emulator: read with adb, as the shell, then by
# LibreHU Helper's report (its section LibreHU-service, Helper's own report test). A debug build with the emulator's
# ABI as well (-PextraAbi=x86_64: the released APK is arm64 only). Outputs in the "diagnostics-test" artifact.
on:
  workflow_dispatch:
    inputs:
      helper_tag:
        description: LibreHU Helper release used for the report
        default: latest-main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build (debug, arm64 and x86_64)
        run: ./gradlew --no-daemon :app:assembleDebug -PextraAbi=x86_64

      - name: LibreHU Helper and its report test
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o helper.apk \
            "https://github.com/LibreHU/LibreHU-helper-app/releases/download/${{ inputs.helper_tag }}/LibreHU-Helper-main.apk"
          git clone --depth 1 https://github.com/LibreHU/LibreHU-helper-app helper-src

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720
          script: python3 tools/diagnostics_test.py app/build/outputs/apk/debug helper.apk helper-src/tools/report_test.py out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-test
          path: out
